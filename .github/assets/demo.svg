<svg xmlns="http://www.w3.org/2000/svg" width="900" height="379" viewBox="0 0 900 379" role="img" aria-label="A four-line comment fails npm run slop; cut to one line, it passes.">
  <style>text{font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre}@keyframes l0{0%,5.26%{opacity:0}5.27%,100%{opacity:1}}.l0{animation:l0 16s steps(1,end) infinite}@keyframes l1{0%,10.53%{opacity:0}10.54%,100%{opacity:1}}.l1{animation:l1 16s steps(1,end) infinite}@keyframes l2{0%,15.79%{opacity:0}15.80%,100%{opacity:1}}.l2{animation:l2 16s steps(1,end) infinite}@keyframes l3{0%,21.05%{opacity:0}21.06%,100%{opacity:1}}.l3{animation:l3 16s steps(1,end) infinite}@keyframes l4{0%,26.32%{opacity:0}26.33%,100%{opacity:1}}.l4{animation:l4 16s steps(1,end) infinite}@keyframes l5{0%,31.58%{opacity:0}31.59%,100%{opacity:1}}.l5{animation:l5 16s steps(1,end) infinite}@keyframes l6{0%,36.84%{opacity:0}36.85%,100%{opacity:1}}.l6{animation:l6 16s steps(1,end) infinite}@keyframes l7{0%,42.11%{opacity:0}42.12%,100%{opacity:1}}.l7{animation:l7 16s steps(1,end) infinite}@keyframes l8{0%,47.37%{opacity:0}47.38%,100%{opacity:1}}.l8{animation:l8 16s steps(1,end) infinite}@keyframes l9{0%,52.63%{opacity:0}52.64%,100%{opacity:1}}.l9{animation:l9 16s steps(1,end) infinite}@keyframes l10{0%,57.89%{opacity:0}57.90%,100%{opacity:1}}.l10{animation:l10 16s steps(1,end) infinite}@keyframes l11{0%,63.16%{opacity:0}63.17%,100%{opacity:1}}.l11{animation:l11 16s steps(1,end) infinite}@keyframes l12{0%,68.42%{opacity:0}68.43%,100%{opacity:1}}.l12{animation:l12 16s steps(1,end) infinite}@keyframes l13{0%,73.68%{opacity:0}73.69%,100%{opacity:1}}.l13{animation:l13 16s steps(1,end) infinite}@keyframes l14{0%,78.95%{opacity:0}78.96%,100%{opacity:1}}.l14{animation:l14 16s steps(1,end) infinite}</style>
  <rect width="900" height="379" rx="10" fill="#0d1117"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/><circle cx="42" cy="18" r="6" fill="#febc2e"/><circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text class="l0" x="20" y="44" fill="#7ee787">$ cat src/checkout.ts</text>
  <text class="l1" x="20" y="65" fill="#e6edf3">// Renders the order summary (Checkout Spec §4.1). It used to live on the cart page,</text>
  <text class="l2" x="20" y="86" fill="#e6edf3">// but moved here when the review step was added, so both pages share it now.</text>
  <text class="l3" x="20" y="107" fill="#e6edf3">// Shows items, then subtotal, shipping and tax, then the total. Never edits the cart.</text>
  <text class="l4" x="20" y="128" fill="#e6edf3">// Kept separate from the payment form so each can change on its own schedule.</text>
  <text class="l5" x="20" y="149" fill="#e6edf3">export function OrderSummary() {}</text>
  <text class="l6" x="20" y="170" fill="#7ee787">$ npm run slop</text>
  <text class="l7" x="20" y="191" fill="#ff7b72">[slop] src/checkout.ts:1 — 4-line comment (max 3). Say what the code cannot in one line; history</text>
  <text class="l8" x="20" y="212" fill="#ff7b72">    belongs in the commit message. See docs/anti-slop/code.md.</text>
  <text class="l9" x="20" y="233" fill="#ff7b72">[slop] 1 comment block(s) over 3 lines — rules: docs/anti-slop/</text>
  <text class="l10" x="20" y="254" fill="#8b949e"># the comment becomes one line</text>
  <text class="l11" x="20" y="275" fill="#e6edf3">// Read-only order summary: items, subtotal, shipping, tax, total.</text>
  <text class="l12" x="20" y="296" fill="#e6edf3">export function OrderSummary() {}</text>
  <text class="l13" x="20" y="317" fill="#7ee787">$ npm run slop</text>
  <text class="l14" x="20" y="338" fill="#7ee787">[slop] no comment block over 3 lines</text>
</svg>
