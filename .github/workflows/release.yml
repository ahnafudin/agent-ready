# Publish a GitHub release whenever main reaches a version that has no tag yet.
# The version comes from package.json, which the post-commit hook bumps from conventional commits.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tag and release the new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "$version is already released"
            exit 0
          fi
          gh release create "$version" --target "$GITHUB_SHA" --title "$version" --generate-notes
