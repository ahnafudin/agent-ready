# Verify registry entries against projects made by each framework's own scaffolder and toolchain.
# A hand-written fixture only echoes the registry back, and `verified` rots, so this also runs monthly.
name: verify-stacks

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 1 * *" # monthly — catches entries that rot
  push:
    paths:
      - "scripts/stacks.json"
      - "scripts/verify-stack.mjs"
      - ".github/workflows/verify-stacks.yml"

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.runsOn || 'ubuntu-latest' }}
    # One entry failing must not hide the others — the point of a run is the
    # whole picture, not the first problem.
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- PHP (php + composer are preinstalled) ----
          # appstarter's phpunit config wants coverage and exits 1 without xdebug,
          # so the runner gets xdebug rather than the project being edited.
          - id: codeigniter4
            setupPhp: true
            scaffold: composer create-project codeigniter4/appstarter fixture --no-interaction

          - id: slim
            scaffold: composer create-project slim/slim-skeleton fixture --no-interaction

          # WordPress has no project creator: build the minimal theme the entry detects plus its lint tools.
          # Only lint runs; the phpunit gate comes from the php base, and a real WP suite needs MySQL.
          - id: wordpress
            only: lint
            scaffold: |
              mkdir -p fixture && cd fixture
              printf '/*\nTheme Name: Fixture\nVersion: 0.1.0\n*/\n' > style.css
              # `composer require` in an empty directory has no manifest to write
              # to, and wpcs pulls a phpcs installer plugin composer will not run
              # unattended unless it is allowed explicitly.
              composer init --no-interaction --name=acme/fixture
              composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
              # Only wpcs is named; composer resolves PHPCSUtils and PHPCSExtra to a
              # matching set on its own.
              composer require --dev --no-interaction wp-coding-standards/wpcs phpunit/phpunit
              # No manual `installed_paths`: it hides PHPCSExtra's sniffs that wpcs references.
              # The composer plugin allowed above registers every installed standard.
              vendor/bin/phpcs -i

          - id: laravel
            scaffold: composer create-project laravel/laravel fixture --no-interaction

          # ---- JVM ----
          - id: quarkus
            scaffold: mvn -B io.quarkus.platform:quarkus-maven-plugin:create -DprojectGroupId=org.acme -DprojectArtifactId=fixture

          # Ktor's creator is a web service, so this is `gradle init` plus the
          # Ktor dependency. Less faithful than the others — but the gates being
          # verified here are Gradle's, and the marker is the real one.
          - id: ktor
            scaffold: |
              mkdir -p fixture && cd fixture
              gradle init --type kotlin-application --dsl kotlin --project-name fixture \
                --package org.acme --test-framework junit-jupiter --no-daemon
              printf '\ndependencies { implementation("io.ktor:ktor-server-core:3.0.0") }\n' >> app/build.gradle.kts

          # The two JVM bases alone: Maven's quickstart archetype and `gradle init`'s Java app.
          - id: maven
            scaffold: |
              mvn -B archetype:generate -DgroupId=org.acme -DartifactId=fixture \
                -DarchetypeArtifactId=maven-archetype-quickstart -DarchetypeVersion=1.5 -DinteractiveMode=false

          - id: gradle
            scaffold: |
              mkdir -p fixture && cd fixture
              gradle init --type java-application --dsl kotlin --project-name fixture \
                --package org.acme --test-framework junit-jupiter --no-daemon

          # Spring Initializr's documented curl form. Its default build is Gradle; the entry
          # extends maven, so the project is asked for as Maven.
          - id: spring-boot
            scaffold: |
              curl -fsSL -G https://start.spring.io/starter.tgz -d dependencies=web \
                -d type=maven-project -d baseDir=fixture | tar -xzf -

          # ---- .NET ----
          - id: blazor
            scaffold: dotnet new blazor -o fixture

          - id: dotnet
            scaffold: dotnet new console -o fixture

          - id: aspnetcore
            scaffold: dotnet new webapp -o fixture

          - id: avalonia
            scaffold: |
              dotnet new install Avalonia.Templates
              dotnet new avalonia.app -o fixture

          # MAUI needs a workload install and Android bits; treated as best-effort
          # rather than dropped, so the run reports whether it is reachable at all.
          - id: maui
            scaffold: |
              dotnet workload install maui-android --skip-sign-check
              dotnet new maui -o fixture

          # ---- Ruby ----
          - id: sinatra
            setupRuby: true
            scaffold: |
              mkdir -p fixture && cd fixture
              # The Gemfile is written outright rather than assembled with
              # `bundle add`, which resolves and installs one gem at a time and
              # gives a less deterministic scaffold.
              printf 'source "https://rubygems.org"\n' > Gemfile
              printf 'gem "sinatra"\ngem "rackup"\ngem "rspec"\ngem "rubocop"\n' >> Gemfile
              bundle install
              # Autocorrect the fixture's own Gemfile; a real project is rubocop-clean before the gate runs.
              bundle exec rubocop -A || true

          - id: rails
            setupRuby: true
            scaffold: |
              gem install rails --no-document
              rails new fixture --skip-git

          # ---- Bun ----
          - id: elysia
            setupBun: true
            scaffold: |
              bun create elysia fixture
              # TS5108: the generated tsconfig still names moduleResolution
              # node10, which TypeScript removed. Upstream's bug, not the gate's.
              sed -i '/moduleResolution/d' fixture/tsconfig.json || true
              # `bun test` exits 1 when it finds nothing, so the fixture needs a
              # real test for the gate to be exercised rather than short-circuited.
              printf 'import { expect, test } from "bun:test";\ntest("smoke", () => expect(1).toBe(1));\n' \
                > fixture/smoke.test.ts

          # The bun base alone. `bun init` writes no test, so it gets elysia's smoke test.
          - id: bun
            setupBun: true
            scaffold: |
              bun init -y fixture
              printf 'import { expect, test } from "bun:test";\ntest("smoke", () => expect(1).toBe(1));\n' \
                > fixture/smoke.test.ts

          # ---- Deno ----
          - id: deno
            setupDeno: true
            scaffold: deno init fixture

          # ---- Node (npm; without a TTY each creator runs on its flags and defaults) ----

          # npm init's placeholder test script exits 1 by design, so the fixture gets a
          # real test, as elysia does.
          - id: node
            scaffold: |
              mkdir -p fixture && cd fixture
              npm init -y
              npm pkg set scripts.test="node --test"
              printf 'import test from "node:test";\ntest("smoke", () => {});\n' > smoke.test.mjs

          - id: nextjs
            scaffold: npx create-next-app@latest fixture --yes

          # `nuxi typecheck` needs vue-tsc, which the starter leaves out and Nuxt's TypeScript docs
          # add. vue-tsc cannot load TypeScript 7, so typescript stays at 6, as create-vue pins it.
          - id: nuxt
            scaffold: |
              npm create nuxt@latest fixture -- --template minimal --packageManager npm --no-gitInit --no-modules
              cd fixture && npm install --save-dev vue-tsc typescript@6

          - id: react-vite
            scaffold: |
              npm create vite@latest fixture -- --template react-ts --no-interactive
              cd fixture && npm install

          - id: vue
            scaffold: |
              npm create vue@latest fixture -- --ts --eslint
              cd fixture && npm install

          # `ng new` configures no linter; Angular's `ng lint` docs add one with `ng add`.
          - id: angular
            scaffold: |
              npx @angular/cli@latest new fixture --defaults --skip-git
              cd fixture && npx ng add angular-eslint --skip-confirmation

          - id: sveltekit
            scaffold: npx sv create fixture --template minimal --types ts --no-add-ons --install npm

          # Without @astrojs/check, `astro check` in CI logs an error and exits 0 having checked
          # nothing, so the fixture installs it. It supports TypeScript 6, not 7.
          - id: astro
            scaffold: |
              npm create astro@latest fixture -- --template minimal --install --no-git --skip-houston --yes
              cd fixture && npm install --save-dev @astrojs/check typescript@6

          # React Router 7's creator. `--yes` also makes a git commit, which needs an identity.
          - id: remix
            scaffold: npx create-react-router@latest fixture --yes --no-git-init

          - id: solidstart
            scaffold: |
              npm create solid@latest -- --project-name fixture --solidstart --v2 --template basic --ts
              cd fixture && npm install

          - id: express
            scaffold: |
              npx express-generator --view=pug fixture
              cd fixture && npm install

          - id: nestjs
            scaffold: npx @nestjs/cli@latest new fixture --package-manager npm --skip-git

          - id: fastify
            scaffold: |
              npx fastify-cli generate fixture
              cd fixture && npm install

          - id: hono
            scaffold: npm create hono@latest fixture -- --template nodejs --install --pm npm

          # The api kit fails its own lint: `create` regenerates database/schema.ts on one long
          # line. The hypermedia kit, listed first, generates a schema that fits.
          - id: adonisjs
            scaffold: npm create adonisjs@latest fixture -- --kit=hypermedia --pkg=npm

          # The default template fails its own lint (react-hooks/set-state-in-effect in a web
          # hook), so this is the official blank-typescript template.
          - id: expo
            scaffold: |
              npx create-expo-app@latest fixture --template blank-typescript --yes
              # Expo's documented ESLint setup is a first `npx expo lint`: it installs ESLint, then
              # fails to load it in that same process. The gate's run afterwards is the real lint.
              cd fixture && (npx expo lint || true)

          - id: react-native
            scaffold: npx @react-native-community/cli@latest init Fixture --directory fixture --pm npm --skip-git-init --install-pods false

          - id: ionic
            scaffold: npx @ionic/cli start fixture blank --type=angular --capacitor --no-git

          # ---- Python (setup-python: the image's own Python refuses pip installs, PEP 668) ----
          - id: django
            setupPython: true
            scaffold: |
              pip install django ruff
              django-admin startproject fixture

          # fastapi-new writes no test and pytest exits 5 on none, so the fixture gets the
          # TestClient test from FastAPI's testing docs. Its uv venv goes on PATH for the gates.
          - id: fastapi
            setupPython: true
            # fastapi-new's main.py trips ruff 0.16's default import rule (I001); lint is the
            # python base's `ruff check .`, which django and streamlit run.
            only: typecheck,test
            scaffold: |
              pip install uv
              uvx fastapi-new fixture
              cd fixture && uv add --dev ruff mypy pytest
              printf 'from fastapi.testclient import TestClient\n\nfrom main import app\n\n\ndef test_root() -> None:\n    assert TestClient(app).get("/").status_code == 200\n' \
                > test_main.py
              echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

          # `streamlit init` asks whether to start the app, so stdin says no. pytest exits 5 on
          # no tests, so the fixture gets an AppTest smoke test from Streamlit's testing docs.
          - id: streamlit
            setupPython: true
            scaffold: |
              pip install streamlit ruff pytest
              echo n | streamlit init fixture
              printf 'from streamlit.testing.v1 import AppTest\n\n\ndef test_app_runs() -> None:\n    assert not AppTest.from_file("streamlit_app.py").run().exception\n' \
                > fixture/test_app.py

          # ---- Go (setup-go: the image only caches toolchains) ----

          # The go base alone: the module and hello world from the Go tutorial.
          - id: go
            setupGo: true
            scaffold: |
              mkdir -p fixture && cd fixture
              go mod init example/hello
              printf 'package main\n\nimport "fmt"\n\nfunc main() {\n\tfmt.Println("Hello, World!")\n}\n' > hello.go

          # `fiber new` runs only `go mod init`; `go mod tidy` records the import its template makes.
          - id: fiber
            setupGo: true
            scaffold: |
              go install github.com/gofiber/cli/fiber@latest
              fiber new fixture
              cd fixture && go mod tidy

          # Gin, Echo and chi ship no creator: each fixture is its docs' quick start
          # (`go mod init`, `go get`, the hello-world main.go), then `go mod tidy`.
          - id: gin
            setupGo: true
            scaffold: |
              mkdir -p fixture && cd fixture
              go mod init fixture
              go get -u github.com/gin-gonic/gin
              cat > main.go <<'EOF'
              package main

              import "github.com/gin-gonic/gin"

              func main() {
                router := gin.Default()
                router.GET("/ping", func(c *gin.Context) {
                  c.JSON(200, gin.H{
                    "message": "pong",
                  })
                })
                router.Run()
              }
              EOF
              go mod tidy

          - id: echo
            setupGo: true
            scaffold: |
              mkdir -p fixture && cd fixture
              go mod init fixture
              go get github.com/labstack/echo/v5
              cat > main.go <<'EOF'
              package main

              import (
                "net/http"

                "github.com/labstack/echo/v5"
                "github.com/labstack/echo/v5/middleware"
              )

              func main() {
                e := echo.New()

                e.Use(middleware.RequestLogger())
                e.Use(middleware.Recover())

                e.GET("/", func(c *echo.Context) error {
                  return c.JSON(http.StatusOK, map[string]string{"message": "Hello, World!"})
                })

                if err := e.Start(":1323"); err != nil {
                  e.Logger.Error("failed to start server", "error", err)
                }
              }
              EOF
              go mod tidy

          - id: chi
            setupGo: true
            scaffold: |
              mkdir -p fixture && cd fixture
              go mod init fixture
              go get -u github.com/go-chi/chi/v5
              cat > main.go <<'EOF'
              package main

              import (
                "net/http"

                "github.com/go-chi/chi/v5"
                "github.com/go-chi/chi/v5/middleware"
              )

              func main() {
                r := chi.NewRouter()
                r.Use(middleware.Logger)
                r.Get("/", func(w http.ResponseWriter, r *http.Request) {
                  w.Write([]byte("welcome"))
                })
                http.ListenAndServe(":3000", r)
              }
              EOF
              go mod tidy

          # ---- Rust (preinstalled; the image lists rustfmt but not clippy, so it is added) ----
          - id: rust
            scaffold: |
              rustup component add clippy
              cargo new fixture

          # axum, Actix Web and Rocket ship no creator: each fixture is `cargo new`, the
          # dependency their docs name, and the docs' hello world.
          - id: axum
            scaffold: |
              rustup component add clippy
              cargo new fixture && cd fixture
              cargo add axum
              cargo add tokio --features full
              cat > src/main.rs <<'EOF'
              use axum::{routing::get, Router};

              #[tokio::main]
              async fn main() {
                  let app = Router::new().route("/", get(|| async { "Hello, World!" }));
                  let listener = tokio::net::TcpListener::bind("0.0.0.0:3000").await.unwrap();
                  axum::serve(listener, app).await.unwrap();
              }
              EOF

          - id: actix
            scaffold: |
              rustup component add clippy
              cargo new fixture && cd fixture
              cargo add actix-web@4
              cat > src/main.rs <<'EOF'
              use actix_web::{get, post, web, App, HttpResponse, HttpServer, Responder};

              #[get("/")]
              async fn hello() -> impl Responder {
                  HttpResponse::Ok().body("Hello world!")
              }

              #[post("/echo")]
              async fn echo(req_body: String) -> impl Responder {
                  HttpResponse::Ok().body(req_body)
              }

              async fn manual_hello() -> impl Responder {
                  HttpResponse::Ok().body("Hey there!")
              }

              #[actix_web::main]
              async fn main() -> std::io::Result<()> {
                  HttpServer::new(|| {
                      App::new()
                          .service(hello)
                          .service(echo)
                          .route("/hey", web::get().to(manual_hello))
                  })
                  .bind(("127.0.0.1", 8080))?
                  .run()
                  .await
              }
              EOF

          - id: rocket
            scaffold: |
              rustup component add clippy
              cargo new fixture && cd fixture
              cargo add rocket@0.5.1
              cat > src/main.rs <<'EOF'
              #[macro_use] extern crate rocket;

              #[get("/")]
              fn index() -> &'static str {
                  "Hello, world!"
              }

              #[launch]
              fn rocket() -> _ {
                  rocket::build().mount("/", routes![index])
              }
              EOF

          # ---- Desktop ----

          # Tauri's documented Linux prerequisites first; clippy as for the Rust entries.
          - id: tauri
            scaffold: |
              sudo apt-get update -q
              sudo apt-get install -y -q libwebkit2gtk-4.1-dev build-essential curl wget file \
                libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
              rustup component add clippy
              npm create tauri-app@latest fixture -- --template vanilla-ts --manager npm --yes
              cd fixture && npm install

          # ---- Dart ----
          - id: dart
            setupDart: true
            scaffold: dart create fixture

          - id: flutter
            setupFlutter: true
            scaffold: flutter create fixture

          # ---- Elixir ----
          - id: elixir
            setupBeam: true
            scaffold: mix new fixture

          # SQLite, one of phx.new's documented databases, needs no server on the runner.
          - id: phoenix
            setupBeam: true
            scaffold: |
              mix archive.install hex phx_new --force
              mix phx.new fixture --database sqlite3 --install

          # ---- Infrastructure ----
          - id: helm
            setupHelm: true
            scaffold: helm create fixture

          # ---- Swift (preinstalled on the 24.04 image; the 26.04 image ships none) ----
          - id: swift
            runsOn: ubuntu-24.04
            scaffold: |
              mkdir -p fixture && cd fixture
              # `--type executable` ships no Tests/ directory, and `swift test`
              # exits 1 when there is no test target at all.
              swift package init --type library --name fixture

          # Godot declares no gates (its build is an editor export), so only the
          # detection marker is meaningful here.
          - id: godot
            detectOnly: true
            scaffold: mkdir -p fixture && printf 'config_version=5\n' > fixture/project.godot

          # Unity's build needs the editor and a licence, but the entry declares no gates,
          # so detection (Assets/ + ProjectSettings/) is all there is to check.
          - id: unity
            detectOnly: true
            scaffold: |
              mkdir -p fixture/Assets fixture/ProjectSettings
              echo "m_EditorVersion: 2022.3.0f1" > fixture/ProjectSettings/ProjectVersion.txt

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        if: matrix.setupBun

      - uses: denoland/setup-deno@v2
        if: matrix.setupDeno

      - uses: actions/setup-python@v7
        if: matrix.setupPython
        with:
          python-version: "3.13"

      - uses: actions/setup-go@v7
        if: matrix.setupGo
        with:
          go-version: stable

      - uses: dart-lang/setup-dart@v1
        if: matrix.setupDart

      - uses: subosito/flutter-action@v2
        if: matrix.setupFlutter
        with:
          channel: stable

      - uses: erlef/setup-beam@v1
        if: matrix.setupBeam
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - uses: azure/setup-helm@v5
        if: matrix.setupHelm

      - uses: shivammathur/setup-php@v2
        if: matrix.setupPhp
        with:
          php-version: "8.3"
          coverage: xdebug

      - uses: ruby/setup-ruby@v1
        if: matrix.setupRuby
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Scaffold ${{ matrix.id }} with its own creator
        id: scaffold
        run: |
          {
            ${{ matrix.scaffold }}
          } 2>&1 | tee scaffold.log
          # The pipeline's status is tee's; the scaffold's own is what matters.
          exit ${PIPESTATUS[0]}

      - name: Verify detection and gates
        id: verify
        run: |
          # No pipe to `tee`: the default shell here is `bash -e`, WITHOUT
          # pipefail, so a pipeline reports tee's exit code and a failed
          # verification would be reported as a pass. Redirect, then decide.
          if node scripts/verify-stack.mjs fixture ${{ matrix.id }} \
            ${{ matrix.detectOnly && ' ' || '--run' }} \
            ${{ matrix.only && format('--only={0}', matrix.only) || '' }} > verify.log 2>&1; then
            cat verify.log
          else
            cat verify.log
            exit 1
          fi

      - name: Report
        if: always()
        run: |
          {
            echo "### \`${{ matrix.id }}\` — ${{ steps.verify.outcome == 'success' && '✅ verified' || '❌ failed' }}"
            echo
            echo '```'
            cat verify.log 2>/dev/null || echo "(scaffold failed before verification ran)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The step summary above is only visible in the web UI, and a job's log
      # needs a token. Annotations need neither — so the reason an entry failed
      # is echoed here, where it can be read straight from the public API.
      - name: Surface the reason as an annotation
        if: failure()
        run: |
          if [ -f verify.log ]; then
            perl -pe 's/\e\[[0-9;]*m//g' verify.log > clean.log
            # The verdict first, then the tail: when a GATE fails, its own output
            # is what says why, and that is nowhere else readable without a token.
            grep -E "FAILED|detected |ranking " clean.log | head -6 \
              | while IFS= read -r line; do echo "::error::${{ matrix.id }} — $line"; done
            tail -12 clean.log \
              | while IFS= read -r line; do echo "::error::${{ matrix.id }} | $line"; done
          else
            echo "::error::${{ matrix.id }} — scaffold failed before verification ran"
            if [ -f scaffold.log ]; then
              tail -15 scaffold.log \
                | while IFS= read -r line; do echo "::error::${{ matrix.id }} scaffold | $line"; done
            fi
          fi

  summary:
    name: result
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any entry did not verify
        run: |
          echo "verify job result: ${{ needs.verify.result }}"
          test "${{ needs.verify.result }}" = "success"
